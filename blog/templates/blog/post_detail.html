{% extends "blog/base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <h2>{{ post.title }}</h2>
    <p>{{ post.created_at }}</p>
    <p>Status: {{ post.status }}</p>

    <div>
        {{ post.body }}
    </div>

    <a href="{% url 'posts_list' %}">Back to all posts</a>
{% endblock %}
