{% extends "blog/base.html" %}

{% block title %}All Posts{% endblock %}

{% block content %}
    <h2>All Posts</h2>

    <ul>
        {% for post in posts %}
            <li>
                <a href="{% url 'post_detail' post.id %}">{{ post.title }}</a>
                <p>{{ post.created_at }}</p>
                <p>Status: {{ post.status }}</p>
            </li>
        {% empty %}
            <li>No posts yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
